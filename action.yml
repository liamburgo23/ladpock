name: LadPock security scan
description: Check your project for the security mistakes a senior reviewer would catch, and mark them on the changed lines.
branding:
  icon: lock
  color: blue

inputs:
  path:
    description: Folder to scan
    default: "."
  profile:
    description: "How deep to go: quick, standard or full"
    default: standard
  fail-on:
    description: "Fail the job on this severity or worse: critical, high, medium or low. Leave empty to never fail."
    default: high
  sarif-file:
    description: Where to write the results, for github/codeql-action/upload-sarif
    default: ladpock.sarif
  offline:
    description: Set to true to skip the online vulnerability lookup
    default: "false"
  baseline:
    description: A file made with `ladpock scan --write-baseline`. Findings listed in it don't fail the job or get marked, so only new ones do.
    default: ""

outputs:
  grade:
    description: The overall grade, for example A or C+
    value: ${{ steps.scan.outputs.grade }}
  score:
    description: The overall score out of 100
    value: ${{ steps.scan.outputs.score }}
  findings:
    description: How many findings are open
    value: ${{ steps.scan.outputs.findings }}
  new:
    description: How many of those aren't in the baseline
    value: ${{ steps.scan.outputs.new }}
  sarif-file:
    description: The results file
    value: ${{ inputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.13"
    - name: Install LadPock
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "$GITHUB_ACTION_PATH"
    - name: Scan
      id: scan
      shell: bash
      # Inputs go through the environment rather than into the script, so a value can't become a command.
      env:
        LP_PATH: ${{ inputs.path }}
        LP_PROFILE: ${{ inputs.profile }}
        LP_FAIL_ON: ${{ inputs.fail-on }}
        LP_SARIF: ${{ inputs.sarif-file }}
        LP_OFFLINE: ${{ inputs.offline }}
        LP_BASELINE: ${{ inputs.baseline }}
      run: |
        args=(scan "$LP_PATH" --profile "$LP_PROFILE" --format sarif -o "$LP_SARIF" --github)
        if [ -n "$LP_FAIL_ON" ]; then args+=(--fail-on "$LP_FAIL_ON"); fi
        if [ "$LP_OFFLINE" = "true" ]; then args+=(--offline); fi
        if [ -n "$LP_BASELINE" ]; then args+=(--baseline "$LP_BASELINE"); fi
        ladpock "${args[@]}"
